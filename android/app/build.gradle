plugins {
    id 'com.android.application'
}

android {
    namespace = "org.libsdl.app"
    compileSdk = 35
    ndkVersion = "28.2.13676358"

    buildFeatures {
        prefab = true
    }

    defaultConfig {
        applicationId = "com.futuramarecomp.app"
        // (testing: -PappIdSuffix=.fresh installs a separate copy next to the real one, with its own data)
        if (project.hasProperty('appIdSuffix')) applicationIdSuffix = project.property('appIdSuffix')
        minSdk = 29
        targetSdk = 34
        versionCode = 7
        versionName = "0.1.6"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-29",
                          "-DANDROID_STL=c++_static",
                          "-DFUT_USE_SDL_GPU=ON",
                          "-DFUT_USE_OPENXR=ON"
                cFlags "-O3"
                cppFlags "-O3"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable = true
        }
    }

    externalNativeBuild {
        cmake {
            path = file('../../CMakeLists.txt')
            version = "3.31.5"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.65'
}
